<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanoid X Bot - Fixed V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E0F2FE;
            --primary: #FFDE4D;
            --dark: #1E293B;
            --accent: #6C5CE7;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark);
            padding: 15px;
            font-size: 15px;
        }

        h1, h2, h3, h4, .logo {
            font-family: 'Fredoka One', cursive;
            color: var(--dark);
        }

        #login-screen {
            max-width: 450px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 6px 6px 0px var(--dark);
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        select, input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border: 3px solid var(--dark);
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            font-weight: 600;
        }

        button {
            width: 100%;
            cursor: pointer;
            padding: 12px 20px;
            border: 3px solid var(--dark);
            border-radius: 14px;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            box-shadow: 4px 4px 0px var(--dark);
            transition: transform 0.1s;
        }

        button:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--dark);
        }

        .btn-primary { background: var(--primary); color: var(--dark); }
        .btn-accent { background: var(--accent); color: white; }
        .btn-danger { background: #FF7675; color: white; }

        #main-dashboard { display: none; max-width: 1100px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 20px;
            padding: 12px 20px;
            margin-bottom: 20px;
            box-shadow: 5px 5px 0px var(--dark);
        }

        .layout { display: grid; grid-template-columns: 1fr; gap: 20px; }

        .sidebar, .content-area {
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 5px 5px 0px var(--dark);
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .folder-item {
            background: #F1F5F9;
            border: 3px solid var(--dark);
            border-radius: 14px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            position: relative;
        }

        .folder-item.active { background: var(--primary); }

        .output-box {
            margin-top: 20px;
            background: #F8FAFC;
            border: 3px solid var(--dark);
            border-radius: 16px;
            padding: 15px;
        }

        .history-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;}
        .history-tag { background: #E2E8F0; padding: 5px 10px; border-radius: 8px; font-size: 12px; border: 2px solid var(--dark); }

        @media (min-width: 768px) {
            .layout { grid-template-columns: 320px 1fr; }
            .folder-grid { grid-template-columns: 1fr; }
            button { width: auto; }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h1 style="font-size: 28px; margin-bottom: 5px;">🤖 Human X Bot</h1>
        <p style="margin-bottom: 20px; color:#64748B;">Anti-AI Humanizer Dashboard</p>
        
        <div class="input-group">
            <label>Select AI Provider:</label>
            <select id="api-provider">
                <option value="gemini">Google Gemini API (Stable on Github Pages)</option>
                <option value="groq">Groq API (Llama 3)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Paste API Key:</label>
            <input type="password" id="api-key-input" placeholder="AI Studio Key or Groq Key...">
        </div>
        
        <div class="input-group">
            <label>Your Twitter Username:</label>
            <input type="text" id="my-username-input" placeholder="e.g., @my_handle">
        </div>
        
        <button class="btn-primary" onclick="login()">Enter Dashboard 🚀</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-dashboard">
        <header>
            <div class="logo">⚡ Humanoid Dash</div>
            <span id="user-profile" style="font-weight: 700;"></span>
            <button class="btn-danger" style="padding: 6px 12px; width: auto;" onclick="logout()">Exit</button>
        </header>

        <div class="layout">
            <div class="sidebar">
                <h3>📁 Folders</h3>
                <div style="margin-top: 12px; display: flex; gap: 6px;">
                    <input type="text" id="new-folder-input" placeholder="Project name...">
                    <button class="btn-primary" style="width: auto;" onclick="createFolder()">+</button>
                </div>
                <div id="folders-list" class="folder-grid"></div>
            </div>

            <div class="content-area" id="workspace" style="display: none;">
                <h2 id="current-project-title" style="margin-bottom: 15px; color: var(--accent);"></h2>
                
                <div class="input-group">
                    <label>Target Account to Tag (@):</label>
                    <input type="text" id="target-username" placeholder="@elonmusk">
                </div>

                <div class="input-group">
                    <label>Project Base Info (বাংলা বা ইংরেজি):</label>
                    <textarea id="project-context" rows="4" placeholder="প্রজেক্টের তথ্য দিন..."></textarea>
                </div>

                <button class="btn-accent" onclick="saveProjectData()">Save Info 💾</button>
                <button class="btn-primary" onclick="generatePost()">Write Human Post ✍️</button>

                <div class="output-box">
                    <h4>✨ Generated Post:</h4>
                    <p id="post-output" style="white-space: pre-wrap; font-weight: 600; margin-top: 10px; color: #1E293B;">Your text will load here...</p>
                    <button class="btn-primary" style="width:auto; font-size:12px; margin-top:10px;" onclick="copyPost()">Copy Text 📋</button>
                </div>

                <div style="margin-top: 20px; border-top: 2px dashed var(--dark); padding-top: 15px;">
                    <h4>🚫 Used Anti-Repeat Log:</h4>
                    <div id="history-log" class="history-container"></div>
                </div>
            </div>

            <div class="content-area" id="no-selection" style="display: flex; justify-content: center; align-items: center; min-height: 200px;">
                <h3 style="color: #94A3B8;">👈 Select or create a folder to begin!</h3>
            </div>
        </div>
    </div>

    <script>
        let appData = { provider: 'gemini', apiKey: '', myUsername: '', folders: {} };
        let currentFolder = null;

        window.onload = function() {
            const saved = localStorage.getItem('humanoid_bot_v3');
            if (saved) {
                appData = JSON.parse(saved);
                if (appData.apiKey && appData.myUsername) showDashboard();
            }
        };

        function login() {
            appData.provider = document.getElementById('api-provider').value;
            appData.apiKey = document.getElementById('api-key-input').value.trim();
            const user = document.getElementById('my-username-input').value.trim();

            if (!appData.apiKey || !user) {
                alert('Please fill all fields!');
                return;
            }
            appData.myUsername = user.startsWith('@') ? user : '@' + user;
            saveToLocalStorage();
            showDashboard();
        }

        function logout() {
            localStorage.removeItem('humanoid_bot_v3');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            document.getElementById('user-profile').innerText = appData.myUsername;
            renderFolders();
        }

        function saveToLocalStorage() {
            localStorage.setItem('humanoid_bot_v3', JSON.stringify(appData));
        }

        function createFolder() {
            const input = document.getElementById('new-folder-input');
            const name = input.value.trim();
            if (!name || appData.folders[name]) return;
            appData.folders[name] = { target: '', context: '', history: [] };
            input.value = '';
            saveToLocalStorage();
            renderFolders();
            selectFolder(name);
        }

        function renderFolders() {
            const list = document.getElementById('folders-list');
            list.innerHTML = '';
            for (let name in appData.folders) {
                const div = document.createElement('div');
                div.className = `folder-item ${currentFolder === name ? 'active' : ''}`;
                div.innerHTML = `<span>📁 ${name}</span><span style="color:red;cursor:pointer;" onclick="deleteFolder(event, '${name}')">🗑️</span>`;
                div.onclick = () => selectFolder(name);
                list.appendChild(div);
            }
        }

        function deleteFolder(e, name) {
            e.stopPropagation();
            if(confirm('Delete folder?')) {
                delete appData.folders[name];
                if(currentFolder === name) currentFolder = null;
                saveToLocalStorage();
                renderFolders();
                document.getElementById('workspace').style.display = 'none';
                document.getElementById('no-selection').style.display = 'flex';
            }
        }

        function selectFolder(name) {
            currentFolder = name;
            renderFolders();
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('workspace').style.display = 'block';
            document.getElementById('current-project-title').innerText = `📁 Folder: ${name}`;
            document.getElementById('target-username').value = appData.folders[name].target || '';
            document.getElementById('project-context').value = appData.folders[name].context || '';
            document.getElementById('post-output').innerText = 'Ready...';
            renderHistory();
        }

        function saveProjectData() {
            if (!currentFolder) return;
            appData.folders[currentFolder].target = document.getElementById('target-username').value.trim();
            appData.folders[currentFolder].context = document.getElementById('project-context').value.trim();
            saveToLocalStorage();
            alert('Saved successfully! 💾');
        }

        function renderHistory() {
            const container = document.getElementById('history-log');
            container.innerHTML = '';
            appData.folders[currentFolder].history.forEach(t => {
                const s = document.createElement('span');
                s.className = 'history-tag';
                s.innerText = t.substring(0, 20) + '...';
                container.appendChild(s);
            });
        }

        // 🛠️ FIXED MULTI-API ENGINE (CORS & RECENT ENDPOINT PROOF)
        async function generatePost() {
            if (!currentFolder) return;
            const target = document.getElementById('target-username').value.trim();
            const context = document.getElementById('project-context').value.trim();
            const output = document.getElementById('post-output');

            if (!context) { alert('Please provide text info!'); return; }
            output.innerText = 'Writing human post... 💭';

            const historyText = appData.folders[currentFolder].history.join(' | ');
            const promptInstruction = `Write a short, casual Twitter/X post based on this info: "${context}".
            RULES:
            1. Language: Write in very simple, short, casual English.
            2. Anti-AI: No emojis. No dashes/hyphens like "-", "—", "–". No robotic words.
            3. Human Typo: You MUST make exactly ONE realistic spelling mistake (like "teh", "dont", "profect", "realy") to make it look manually typed.
            4. Tagging: Tag ${target} naturally.
            5. Unique: Do not repeat or copy the style of these past posts: [${historyText}].
            6. Output ONLY the raw post. No quotes, no intro text.`;

            if (appData.provider === 'gemini') {
                // FIXED: v1 Model URL Architecture for Web Browsers 
                try {
                    const url = `https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=${appData.apiKey}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: promptInstruction }] }] })
                    });
                    const data = await res.json();
                    
                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        displayResult(data.candidates[0].content.parts[0].text);
                    } else {
                        output.innerText = "Error: Invalid Gemini Key, or your Key has expired/been restricted.";
                    }
                } catch (e) {
                    output.innerText = "Gemini Connection Failed. Please ensure your Key is correct.";
                }
            } else {
                // Groq API CORS Fallback Handling
                try {
                    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${appData.apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'llama3-8b-8192',
                            messages: [{ role: 'user', content: promptInstruction }],
                            temperature: 0.8
                        })
                    });
                    const data = await res.json();
                    if(data.choices && data.choices[0].message.content) {
                        displayResult(data.choices[0].message.content);
                    } else {
                        output.innerText = "Groq Key Error or Key Blocked.";
                    }
                } catch(e) {
                    output.innerText = "CORS/Network Blocked Groq. Please use the Google Gemini API option; it is completely stable on GitHub Pages.";
                }
            }
        }

        function displayResult(text) {
            let cleanText = text.trim().replace(/^["']|["']$/g, '');
            document.getElementById('post-output').innerText = cleanText;
            appData.folders[currentFolder].history.push(cleanText);
            saveToLocalStorage();
            renderHistory();
        }

        function copyPost() {
            const text = document.getElementById('post-output').innerText;
            if(text && !text.startsWith('Ready') && !text.startsWith('Writing')) {
                navigator.clipboard.writeText(text);
                alert('Copied! 📋');
            }
        }
    </script>
</body>
</html>
