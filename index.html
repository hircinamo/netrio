<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanoid X Bot - Fixed Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E0F2FE;
            --primary: #FFDE4D;
            --dark: #1E293B;
            --accent: #6C5CE7;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark);
            padding: 15px;
            font-size: 15px;
        }

        h1, h2, h3, h4, .logo {
            font-family: 'Fredoka One', cursive;
            color: var(--dark);
        }

        #login-screen {
            max-width: 450px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 6px 6px 0px var(--dark);
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        select, input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border: 3px solid var(--dark);
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            font-weight: 600;
        }

        button {
            width: 100%;
            cursor: pointer;
            padding: 12px 20px;
            border: 3px solid var(--dark);
            border-radius: 14px;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            box-shadow: 4px 4px 0px var(--dark);
            transition: transform 0.1s;
        }

        button:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--dark);
        }

        .btn-primary { background: var(--primary); color: var(--dark); }
        .btn-accent { background: var(--accent); color: white; }
        .btn-danger { background: #FF7675; color: white; }

        #main-dashboard { display: none; max-width: 1100px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 20px;
            padding: 12px 20px;
            margin-bottom: 20px;
            box-shadow: 5px 5px 0px var(--dark);
        }

        .layout { display: grid; grid-template-columns: 1fr; gap: 20px; }

        .sidebar, .content-area {
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 5px 5px 0px var(--dark);
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .folder-item {
            background: #F1F5F9;
            border: 3px solid var(--dark);
            border-radius: 14px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            position: relative;
        }

        .folder-item.active { background: var(--primary); }

        .output-box {
            margin-top: 20px;
            background: #F8FAFC;
            border: 3px solid var(--dark);
            border-radius: 16px;
            padding: 15px;
        }

        @media (min-width: 768px) {
            .layout { grid-template-columns: 320px 1fr; }
            .folder-grid { grid-template-columns: 1fr; }
            button { width: auto; }
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">
        <h1 style="font-size: 28px; margin-bottom: 5px;">🤖 Human X Bot</h1>
        <p style="margin-bottom: 20px; color:#64748B;">Fixed Client-Side API Gateway</p>
        
        <div class="input-group">
            <label>Select AI Provider:</label>
            <select id="api-provider">
                <option value="groq">Groq API (Llama 3)</option>
                <option value="gemini">Google Gemini API (Flash)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Paste API Key:</label>
            <input type="password" id="api-key-input" placeholder="gsk_... or AIzaSy...">
        </div>
        
        <div class="input-group">
            <label>Your Twitter Handle Name:</label>
            <input type="text" id="my-username-input" placeholder="@my_account">
        </div>
        
        <button class="btn-primary" onclick="login()">Enter Bot Dashboard 🚀</button>
    </div>

    <!-- 2. MAIN DASHBOARD -->
    <div id="main-dashboard">
        <header>
            <div class="logo">⚡ Humanoid Dash</div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span id="user-profile" style="font-weight: 700; font-size: 14px; color: var(--accent);"></span>
                <button class="btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="logout()">Exit</button>
            </div>
        </header>

        <div class="layout">
            <div class="sidebar">
                <h3>📁 Project Folders</h3>
                <div style="margin-top: 12px; display: flex; gap: 6px;">
                    <input type="text" id="new-folder-input" placeholder="Folder Name...">
                    <button class="btn-primary" style="width: auto;" onclick="createFolder()">+</button>
                </div>
                <div id="folders-list" class="folder-grid"></div>
            </div>

            <div class="content-area" id="workspace" style="display: none;">
                <h2 id="current-project-title" style="margin-bottom: 15px; color: var(--accent);"></h2>
                
                <div class="input-group">
                    <label>Target Account Username to Tag (@):</label>
                    <input type="text" id="target-username" placeholder="@target_user">
                </div>

                <div class="input-group">
                    <label>Project Base Info (বাংলা বা ইংরেজি):</label>
                    <textarea id="project-context" rows="4" placeholder="প্রজেক্টের তথ্য দিন..."></textarea>
                </div>

                <button class="btn-accent" onclick="saveProjectData()">Save Info 💾</button>
                <button class="btn-primary" onclick="generatePost()">Write Human Post ✍️</button>

                <div class="output-box">
                    <h4>✨ Generated Text:</h4>
                    <p id="post-output" style="white-space: pre-wrap; font-weight: 600; color: #334155; margin-top: 10px;"></p>
                    <button class="btn-primary" style="width:auto; font-size:12px; margin-top:10px;" onclick="copyPost()">Copy Text 📋</button>
                </div>
            </div>

            <div class="content-area" id="no-selection" style="display: flex; justify-content: center; align-items: center; min-height: 200px;">
                <h3 style="color: #94A3B8;">👈 Select or create a folder to begin!</h3>
            </div>
        </div>
    </div>

    <script>
        let appData = { provider: 'groq', apiKey: '', myUsername: '', folders: {} };
        let currentFolder = null;

        window.onload = function() {
            const savedData = localStorage.getItem('humanoid_bot_v3');
            if (savedData) {
                appData = JSON.parse(savedData);
                if (appData.apiKey && appData.myUsername) showDashboard();
            }
        };

        function login() {
            const provider = document.getElementById('api-provider').value;
            const key = document.getElementById('api-key-input').value.trim();
            const user = document.getElementById('my-username-input').value.trim();

            if (!key || !user) { alert('Fill all fields!'); return; }
            appData.provider = provider; appData.apiKey = key; appData.myUsername = user;
            saveToLocalStorage(); showDashboard();
        }

        function logout() { localStorage.clear(); location.reload(); }
        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            document.getElementById('user-profile').innerText = `User: ${appData.myUsername}`;
            renderFolders();
        }

        function saveToLocalStorage() { localStorage.setItem('humanoid_bot_v3', JSON.stringify(appData)); }

        function createFolder() {
            const input = document.getElementById('new-folder-input');
            const name = input.value.trim();
            if (!name || appData.folders[name]) return;
            appData.folders[name] = { target: '', context: '', history: [] };
            input.value = ''; saveToLocalStorage(); renderFolders(); selectFolder(name);
        }

        function renderFolders() {
            const list = document.getElementById('folders-list'); list.innerHTML = '';
            for (let name in appData.folders) {
                const div = document.createElement('div');
                div.className = `folder-item ${currentFolder === name ? 'active' : ''}`;
                div.innerHTML = `<span>📁 ${name}</span><span style="color:red; cursor:pointer;" onclick="event.stopPropagation(); deleteFolder('${name}')">🗑️</span>`;
                div.onclick = () => selectFolder(name);
                list.appendChild(div);
            }
        }

        function deleteFolder(name) {
            delete appData.folders[name]; if(currentFolder === name) currentFolder = null;
            saveToLocalStorage(); renderFolders(); document.getElementById('workspace').style.display = 'none';
            document.getElementById('no-selection').style.display = 'flex';
        }

        function selectFolder(name) {
            currentFolder = name; renderFolders();
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('workspace').style.display = 'block';
            document.getElementById('current-project-title').innerText = `📁 Folder: ${name}`;
            document.getElementById('target-username').value = appData.folders[name].target || '';
            document.getElementById('project-context').value = appData.folders[name].context || '';
            document.getElementById('post-output').innerText = 'Ready...';
        }

        function saveProjectData() {
            if (!currentFolder) return;
            appData.folders[currentFolder].target = document.getElementById('target-username').value.trim();
            appData.folders[currentFolder].context = document.getElementById('project-context').value.trim();
            saveToLocalStorage(); alert('Saved!');
        }

        // 🚨 FIXED GENERATOR: BYPASSING CORS ERRORS
        async function generatePost() {
            if (!currentFolder) return;
            const target = document.getElementById('target-username').value.trim();
            const context = document.getElementById('project-context').value.trim();
            const output = document.getElementById('post-output');
            
            if (!context) { alert('Context is empty!'); return; }
            output.innerText = 'Writing human-style tweet... ✍️';

            const historyText = appData.folders[currentFolder].history.join(' | ');
            const systemPrompt = `You are a real busy human writing a short tweet. Translate the info to casual English. 
            RULES: 
            1. No emojis. 
            2. No dashes/hyphens like "-", "—", "–". 
            3. Must include exactly ONE natural typo/spelling mistake (like teh, realy, tomorow, coolle). 
            4. Tag ${target} naturally. 
            5. Output ONLY raw text, no quotes. 
            6. Must be completely different from these: [${historyText}].`;

            // 🛠️ Using Allorigins Proxy to completely bypass Browser CORS Blocking
            if (appData.provider === 'gemini') {
                const targetUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${appData.apiKey}`;
                try {
                    const response = await fetch(targetUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `${systemPrompt}\n\nContext:\n${context}` }] }] })
                    });
                    const data = await response.json();
                    finalize(data.candidates[0].content.parts[0].text);
                } catch(e) {
                    output.innerText = "Error: Gemini API key invalid or blocked. Try checking the Key again.";
                }
            } else {
                // Groq Proxy Call
                const targetUrl = 'https://api.groq.com/openai/v1/chat/completions';
                try {
                    // We route via a public CORS proxy to trick the browser protection safely
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                    
                    const response = await fetch(proxyUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${appData.apiKey}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                model: 'llama3-8b-8192',
                                messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: context }],
                                temperature: 0.85
                            })
                        })
                    });
                    
                    const proxyData = await response.json();
                    const actualData = JSON.parse(proxyData.contents);
                    finalize(actualData.choices[0].message.content);
                } catch(e) {
                    output.innerText = "CORS Error Bypassed, but Groq Key failed. Please try switching to Gemini API option on login screen, it is more stable on Github Pages.";
                }
            }
        }

        function finalize(text) {
            let clean = text.trim().replace(/^["']|["']$/g, '');
            document.getElementById('post-output').innerText = clean;
            appData.folders[currentFolder].history.push(clean);
            saveToLocalStorage();
        }

        function copyPost() {
            navigator.clipboard.writeText(document.getElementById('post-output').innerText);
            alert('Copied! 📋');
        }
    </script>
</body>
</html>
