<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanoid X Bot - Anti-Block Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E0F2FE;
            --primary: #FFDE4D;
            --dark: #1E293B;
            --accent: #6C5CE7;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark);
            padding: 15px;
            font-size: 15px;
        }

        h1, h2, h3, h4, .logo {
            font-family: 'Fredoka One', cursive;
            color: var(--dark);
        }

        #login-screen {
            max-width: 450px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 6px 6px 0px var(--dark);
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border: 3px solid var(--dark);
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            font-weight: 600;
        }

        button {
            width: 100%;
            cursor: pointer;
            padding: 12px 20px;
            border: 3px solid var(--dark);
            border-radius: 14px;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            box-shadow: 4px 4px 0px var(--dark);
            transition: transform 0.1s;
        }

        button:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--dark);
        }

        .btn-primary { background: var(--primary); color: var(--dark); }
        .btn-accent { background: var(--accent); color: white; }
        .btn-danger { background: #FF7675; color: white; }

        #main-dashboard { display: none; max-width: 1100px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 20px;
            padding: 12px 20px;
            margin-bottom: 20px;
            box-shadow: 5px 5px 0px var(--dark);
        }

        .layout { display: grid; grid-template-columns: 1fr; gap: 20px; }

        .sidebar, .content-area {
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 5px 5px 0px var(--dark);
            overflow: hidden;
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .folder-item {
            background: #F1F5F9;
            border: 3px solid var(--dark);
            border-radius: 14px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            position: relative;
        }

        .folder-item.active { background: var(--primary); }

        .output-box {
            margin-top: 20px;
            background: #F8FAFC;
            border: 3px solid var(--dark);
            border-radius: 16px;
            padding: 15px;
            word-break: break-word;
        }

        .history-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;}
        .history-tag { background: #E2E8F0; padding: 5px 10px; border-radius: 8px; font-size: 12px; border: 2px solid var(--dark); }

        @media (min-width: 768px) {
            .layout { grid-template-columns: 320px 1fr; }
            .folder-grid { grid-template-columns: 1fr; }
            button { width: auto; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="font-size: 28px; margin-bottom: 5px;">🤖 Human X Bot</h1>
        <p style="margin-bottom: 20px; color:#64748B;">Safe & Secure Groq Console</p>
        
        <div class="input-group">
            <label>Paste your Groq API Key:</label>
            <input type="password" id="api-key-input" placeholder="gsk_...">
        </div>
        
        <div class="input-group">
            <label>Your Twitter Username:</label>
            <input type="text" id="my-username-input" placeholder="e.g., @my_handle">
        </div>
        
        <button class="btn-primary" onclick="login()">Open Dashboard 🚀</button>
    </div>

    <div id="main-dashboard">
        <header>
            <div class="logo">⚡ XBot NAHAL</div>
            <span id="user-profile" style="font-weight: 700; color: var(--accent);"></span>
            <button class="btn-danger" style="padding: 6px 12px; width: auto;" onclick="logout()">Logout</button>
        </header>

        <div class="layout">
            <div class="sidebar">
                <h3>📁 Folders / Projects</h3>
                <div style="margin-top: 12px; display: flex; gap: 6px;">
                    <input type="text" id="new-folder-input" placeholder="Folder name...">
                    <button class="btn-primary" style="width: auto;" onclick="createFolder()">+</button>
                </div>
                <div id="folders-list" class="folder-grid"></div>
            </div>

            <div class="content-area" id="workspace" style="display: none;">
                <h2 id="current-project-title" style="margin-bottom: 15px; color: var(--accent);"></h2>
                
                <div class="input-group">
                    <label>Target Twitter Username to Tag (@):</label>
                    <input type="text" id="target-username" placeholder="@elonmusk">
                </div>

                <div class="input-group">
                    <label>Project Details / Context (বাংলা বা ইংরেজি):</label>
                    <textarea id="project-context" rows="4" placeholder="প্রজেক্টের তথ্য এখানে দিন..."></textarea>
                </div>

                <button class="btn-accent" onclick="saveProjectData()">Save Info 💾</button>
                <button class="btn-primary" onclick="generatePost()">Write Human Post ✍️</button>

                <div class="output-box">
                    <h4>✨ Generated Post:</h4>
                    <p id="post-output" style="white-space: pre-wrap; font-weight: 600; margin-top: 10px; color: #1E293B; line-height: 1.6;"></p>
                    <button class="btn-primary" style="width:auto; font-size:12px; margin-top:10px;" onclick="copyPost()">Copy Text 📋</button>
                </div>

                <div style="margin-top: 20px; border-top: 2px dashed var(--dark); padding-top: 15px;">
                    <h4>🚫 Used Anti-Repeat Log:</h4>
                    <div id="history-log" class="history-container"></div>
                </div>
            </div>

            <div class="content-area" id="no-selection" style="display: flex; justify-content: center; align-items: center; min-height: 200px;">
                <h3 style="color: #94A3B8;">👈 Select or create a folder to begin!</h3>
            </div>
        </div>
    </div>

    <script>
        let appData = { apiKey: '', myUsername: '', folders: {} };
        let currentFolder = null;

        window.onload = function() {
            document.getElementById('post-output').innerText = 'Ready to type...';
            const saved = localStorage.getItem('humanoid_bot_groq_secure');
            if (saved) {
                appData = JSON.parse(saved);
                if (appData.apiKey && appData.myUsername) showDashboard();
            }
        };

        function login() {
            const key = document.getElementById('api-key-input').value.trim();
            const user = document.getElementById('my-username-input').value.trim();

            if (!key || !user) {
                alert('Please fill all fields!');
                return;
            }
            appData.apiKey = key;
            appData.myUsername = user.startsWith('@') ? user : '@' + user;
            saveToLocalStorage();
            showDashboard();
        }

        function logout() {
            if(confirm("Logout from dashboard? Your key will be safely removed from browser cache.")) {
                localStorage.removeItem('humanoid_bot_groq_secure');
                location.reload();
            }
        }

        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            document.getElementById('user-profile').innerText = `User: ${appData.myUsername}`;
            renderFolders();
        }

        function saveToLocalStorage() {
            localStorage.setItem('humanoid_bot_groq_secure', JSON.stringify(appData));
        }

        function createFolder() {
            const input = document.getElementById('new-folder-input');
            const name = input.value.trim();
            if (!name || appData.folders[name]) return;
            appData.folders[name] = { target: '', context: '', history: [] };
            input.value = '';
            saveToLocalStorage();
            renderFolders();
            selectFolder(name);
        }

        function renderFolders() {
            const list = document.getElementById('folders-list');
            list.innerHTML = '';
            for (let name in appData.folders) {
                const div = document.createElement('div');
                div.className = `folder-item ${currentFolder === name ? 'active' : ''}`;
                div.innerHTML = `<span>📁 ${name}</span><span style="color:red;cursor:pointer;font-size:16px;" onclick="deleteFolder(event, '${name}')">🗑️</span>`;
                div.onclick = () => selectFolder(name);
                list.appendChild(div);
            }
        }

        function deleteFolder(e, name) {
            e.stopPropagation();
            if(confirm(`Delete folder "${name}"?`)) {
                delete appData.folders[name];
                if(currentFolder === name) currentFolder = null;
                saveToLocalStorage();
                renderFolders();
                document.getElementById('workspace').style.display = 'none';
                document.getElementById('no-selection').style.display = 'flex';
            }
        }

        function selectFolder(name) {
            currentFolder = name;
            renderFolders();
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('workspace').style.display = 'block';
            document.getElementById('current-project-title').innerText = `📁 Active Folder: ${name}`;
            document.getElementById('target-username').value = appData.folders[name].target || '';
            document.getElementById('project-context').value = appData.folders[name].context || '';
            document.getElementById('post-output').innerText = 'Ready to type...';
            renderHistory();
        }

        function saveProjectData() {
            if (!currentFolder) return;
            appData.folders[currentFolder].target = document.getElementById('target-username').value.trim();
            appData.folders[currentFolder].context = document.getElementById('project-context').value.trim();
            saveToLocalStorage();
            alert('Folder data saved locally! 💾');
        }

        function renderHistory() {
            const container = document.getElementById('history-log');
            container.innerHTML = '';
            appData.folders[currentFolder].history.forEach(t => {
                const s = document.createElement('span');
                s.className = 'history-tag';
                s.innerText = t.substring(0, 22) + '...';
                container.appendChild(s);
            });
        }

        async function generatePost() {
            if (!currentFolder) return;
            const target = document.getElementById('target-username').value.trim();
            const context = document.getElementById('project-context').value.trim();
            const output = document.getElementById('post-output');

            if (!context) { alert('Please provide project details!'); return; }
            output.innerText = 'Connecting to Groq safely... 💭';

            const historyText = appData.folders[currentFolder].history.join(' | ');
            
            const systemInstruction = `You are a casual human user on Twitter (X) who writes viral, highly engaging, and well-structured tweets. Translate the context to simple English if it's in Bengali.
            
            POST STRUCTURE:
            - Break down the response into 2-3 short paragraphs or clean, distinct lines with line breaks (empty rows) between them. Do not write everything in a single block or line. Make it look clean and visually structured for mobile screens.

            MANDATORY RULES:
            1. No AI Footprint: DO NOT use any emojis. Never use dashes/hyphens like "-", "—", "–". Do not use overly formal/robotic words.
            2. Language Style: Very casual, trendy, short, and natural English. 
            3. Smart Typo Rule: You MUST pick exactly ONE valid English word in the final text and make a single-letter typo inside it (e.g., changing 'the' to 'teh', 'really' to 'realy', 'tomorrow' to 'tomorow', or 'project' to 'profect'). Do not corrupt the whole word, just modify one letter so it looks like an authentic fast-typing human mistake.
            4. Tagging: Always tag the user ${target} naturally inside the body or at the end on a fresh line.
            5. Anti-Repeat: Make this post completely different in sentence structure and wording from these past items: [${historyText}].
            6. Pure Output: Reply ONLY with the tweet text. Do not include quotes, intros, or explanations.`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${appData.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            { role: 'system', content: systemInstruction },
                            { role: 'user', content: `Context data: ${context}` }
                        ],
                        temperature: 0.85
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0] && data.choices[0].message.content) {
                    let finalTweet = data.choices[0].message.content.trim();
                    finalTweet = finalTweet.replace(/^["']|["']$/g, ''); // Clean outside quotes
                    
                    output.innerText = finalTweet;
                    appData.folders[currentFolder].history.push(finalTweet);
                    saveToLocalStorage();
                    renderHistory();
                } else if (data.error) {
                    output.innerText = `Groq API Error: ${data.error.message}\n(Please use a valid Groq Key)`;
                } else {
                    output.innerText = "Error: Key rejected or blocked by Groq.";
                }
            } catch (error) {
                console.error(error);
                output.innerText = "Connection Error: Failed to contact Groq Server.";
            }
        }

        // 📋 100% RELIABLE UNIVERSAL COPY TO CLIPBOARD SYSTEM
        function copyPost() {
            const text = document.getElementById('post-output').innerText;
            if(!text || text.startsWith('Ready') || text.startsWith('Connecting')) {
                return;
            }

            // Method 1: Modern API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('Copied to clipboard! 📋');
                }).catch(err => {
                    fallbackCopyTextSelection(text);
                });
            } else {
                // Method 2: Fallback for older mobile browsers or HTTP contexts
                fallbackCopyTextSelection(text);
            }
        }

        function fallbackCopyTextSelection(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            // Prevent scrolling to bottom
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                if(successful) {
                    alert('Copied to clipboard! 📋');
                } else {
                    alert('Failed to copy. Please copy manually.');
                }
            } catch (err) {
                alert('Failed to copy. Please copy manually.');
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
