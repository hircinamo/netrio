<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanoid X Bot Dash</title>
    <!-- Google Fonts for Cartoonish/Playful Vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F0F4F8;
            --primary: #FFDE4D;
            --secondary: #FFB200;
            --dark: #2D3748;
            --accent: #6C5CE7;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark);
            padding: 20px;
            font-size: 16px;
        }

        h1, h2, h3, .logo {
            font-family: 'Fredoka One', cursive;
            color: var(--dark);
        }

        /* Login Screen */
        #login-screen {
            max-width: 500px;
            margin: 80px auto;
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 8px 8px 0px var(--dark);
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border: 3px solid var(--dark);
            border-radius: 12px;
            font-size: 16px;
            background: #FFF;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
        }

        button {
            cursor: pointer;
            padding: 12px 24px;
            border: 3px solid var(--dark);
            border-radius: 12px;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            transition: transform 0.1s ease;
            box-shadow: 4px 4px 0px var(--dark);
        }

        button:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--dark);
        }

        .btn-primary { background: var(--primary); }
        .btn-accent { background: var(--accent); color: white; }
        .btn-danger { background: #FF7675; color: white; }

        /* Main Dashboard Layout */
        #main-dashboard {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 20px;
            padding: 15px 30px;
            margin-bottom: 30px;
            box-shadow: 6px 6px 0px var(--dark);
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        /* Sidebar / Folders */
        .sidebar {
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 6px 6px 0px var(--dark);
            height: fit-content;
        }

        .folder-item {
            background: #F9F9F9;
            border: 3px solid var(--dark);
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .folder-item:hover, .folder-item.active {
            background: var(--primary);
        }

        /* Content Area */
        .content-area {
            background: var(--card-bg);
            border: 4px solid var(--dark);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 6px 6px 0px var(--dark);
        }

        /* Output Box */
        .output-box {
            margin-top: 25px;
            background: #EDF2F7;
            border: 3px solid var(--dark);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            min-height: 100px;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
            padding: 6px 12px;
        }

        .history-tag {
            display: inline-block;
            background: #E2E8F0;
            padding: 4px 8px;
            border-radius: 6px;
            margin: 4px;
            font-size: 12px;
            border: 1px solid var(--dark);
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h1 style="font-size: 32px; margin-bottom: 10px;">🤖 Humanoid X Bot</h1>
        <p style="margin-bottom: 25px; color:#666;">Set your credentials to start safely.</p>
        
        <div class="input-group">
            <label>Groq API Key:</label>
            <input type="password" id="api-key-input" placeholder="gsk_...">
        </div>
        
        <div class="input-group">
            <label>Your Twitter Username:</label>
            <input type="text" id="my-username-input" placeholder="@yourhandle">
        </div>
        
        <button class="btn-primary" onclick="login()">Enter Dashboard 🚀</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-dashboard">
        <header>
            <div class="logo" style="font-size: 28px;">⚡ X-Bot Area</div>
            <div id="user-profile" style="font-weight: 700;"></div>
            <button class="btn-danger" style="padding: 6px 12px;" onclick="logout()">Logout</button>
        </header>

        <div class="layout">
            <!-- SIDEBAR: FOLDERS -->
            <div class="sidebar">
                <h3>📁 Projects / Folders</h3>
                <div style="margin-top: 15px; display: flex; gap: 8px;">
                    <input type="text" id="new-folder-input" placeholder="Project name..." style="padding: 8px;">
                    <button class="btn-primary" style="padding: 8px 12px;" onclick="createFolder()">+</button>
                </div>
                <div id="folders-list"><!-- Dynamic Folders --></div>
            </div>

            <!-- MAIN WORKSPACE -->
            <div class="content-area" id="workspace" style="display: none;">
                <h2 id="current-project-title" style="margin-bottom: 20px; color: var(--accent);"></h2>
                
                <div class="input-group">
                    <label>Target Twitter Username to Tag (@):</label>
                    <input type="text" id="target-username" placeholder="@target_user">
                </div>

                <div class="input-group">
                    <label>Project Details / Context (বাংলায় বা ইংরেজিতে লিখুন):</label>
                    <textarea id="project-context" rows="5" placeholder="এই প্রজেক্টের মূল বিষয়বস্তু এখানে বলুন..."></textarea>
                </div>

                <button class="btn-accent" onclick="saveProjectData()">Save Context 💾</button>
                <button class="btn-primary" style="margin-left: 10px;" onclick="generatePost()">Generate Human Post ✍️</button>

                <!-- OUTPUT -->
                <div class="output-box">
                    <button class="copy-btn btn-primary" onclick="copyPost()">Copy</button>
                    <h4 style="margin-bottom: 10px; font-family:'Fredoka One';">Generated Post:</h4>
                    <p id="post-output" style="white-space: pre-wrap; font-weight: 500; color: #2D3748;">Your human-like post will appear here...</p>
                </div>

                <!-- HISTORY LOGS TO PREVENT REPETITION -->
                <div style="margin-top: 20px;">
                    <h4>Used Post Seeds (Anti-Repetition Log):</h4>
                    <div id="history-log"></div>
                </div>
            </div>

            <div class="content-area" id="no-selection" style="display: flex; align-items: center; justify-content: center; background: #F9F9F9;">
                <h3 style="color: #A0AEC0;">👈 Select or create a folder to start working!</h3>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let appData = {
            apiKey: '',
            myUsername: '',
            folders: {} // Format: { folderName: { target: '', context: '', history: [] } }
        };
        let currentFolder = null;

        // Load data from LocalStorage on initialization
        window.onload = function() {
            const savedData = localStorage.getItem('humanoid_bot_data');
            if (savedData) {
                appData = JSON.parse(savedData);
                if (appData.apiKey && appData.myUsername) {
                    showDashboard();
                }
            }
        };

        function login() {
            const key = document.getElementById('api-key-input').value.trim();
            const user = document.getElementById('my-username-input').value.trim();

            if (!key || !user) {
                alert('Please fill in both fields!');
                return;
            }

            appData.apiKey = key;
            appData.myUsername = user.startsWith('@') ? user : '@' + user;
            saveToLocalStorage();
            showDashboard();
        }

        function logout() {
            if(confirm("Are you sure you want to logout? All local data will remain saved.")){
                document.getElementById('login-screen').style.display = 'block';
                document.getElementById('main-dashboard').style.display = 'none';
            }
        }

        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            document.getElementById('user-profile').innerText = `User: ${appData.myUsername}`;
            renderFolders();
        }

        function saveToLocalStorage() {
            localStorage.setItem('humanoid_bot_data', JSON.stringify(appData));
        }

        // Folder Operations
        function createFolder() {
            const input = document.getElementById('new-folder-input');
            const folderName = input.value.trim();
            if (!folderName) return;

            if (appData.folders[folderName]) {
                alert('Folder already exists!');
                return;
            }

            appData.folders[folderName] = {
                target: '',
                context: '',
                history: []
            };

            input.value = '';
            saveToLocalStorage();
            renderFolders();
            selectFolder(folderName);
        }

        function renderFolders() {
            const listContainer = document.getElementById('folders-list');
            listContainer.innerHTML = '';
            for (let folderName in appData.folders) {
                const div = document.createElement('div');
                div.className = `folder-item ${currentFolder === folderName ? 'active' : ''}`;
                div.innerHTML = `<span>📁 ${folderName}</span>`;
                div.onclick = () => selectFolder(folderName);
                
                // Delete button for folder
                const delBtn = document.createElement('span');
                delBtn.innerHTML = '❌';
                delBtn.style.cursor = 'pointer';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if(confirm(`Delete ${folderName}?`)) {
                        delete appData.folders[folderName];
                        if (currentFolder === folderName) currentFolder = null;
                        saveToLocalStorage();
                        renderFolders();
                        resetWorkspace();
                    }
                };
                div.appendChild(delBtn);
                listContainer.appendChild(div);
            }
        }

        function selectFolder(name) {
            currentFolder = name;
            renderFolders();
            
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('workspace').style.display = 'block';
            document.getElementById('current-project-title').innerText = `📁 Project: ${name}`;
            
            // Load current folder data
            document.getElementById('target-username').value = appData.folders[name].target || '';
            document.getElementById('project-context').value = appData.folders[name].context || '';
            document.getElementById('post-output').innerText = 'Your human-like post will appear here...';
            
            renderHistory();
        }

        function resetWorkspace() {
            document.getElementById('workspace').style.display = 'none';
            document.getElementById('no-selection').style.display = 'flex';
        }

        function saveProjectData() {
            if (!currentFolder) return;
            const target = document.getElementById('target-username').value.trim();
            const context = document.getElementById('project-context').value.trim();

            appData.folders[currentFolder].target = target.startsWith('@') || target === '' ? target : '@' + target;
            appData.folders[currentFolder].context = context;
            
            saveToLocalStorage();
            alert('Project context updated successfully!');
        }

        function renderHistory() {
            const logContainer = document.getElementById('history-log');
            logContainer.innerHTML = '';
            if (currentFolder && appData.folders[currentFolder].history) {
                appData.folders[currentFolder].history.forEach(item => {
                    const span = document.createElement('span');
                    span.className = 'history-tag';
                    span.innerText = item.substring(0, 30) + '...';
                    logContainer.appendChild(span);
                });
            }
        }

        // AI Generation Logic (Using Groq API Architecture)
        async function generatePost() {
            if (!currentFolder) return;
            
            const target = document.getElementById('target-username').value.trim();
            const context = document.getElementById('project-context').value.trim();
            
            if (!context) {
                alert('Please provide some project details first!');
                return;
            }

            const outputElement = document.getElementById('post-output');
            outputElement.innerText = 'Analyzing & writing like a human... 🤖💭';

            // Extract past history to feed into system prompt to avoid repetition
            const historyText = appData.folders[currentFolder].history.join(' | ');

            // Strict Rules System Prompt Injection
            const systemPrompt = `You are an expert ghostwriter for Twitter (X). Your goal is to write a short tweet based on the context provided.
            CRITICAL RULES:
            1. Language: Write 100% in simple, casual, short English.
            2. Anti-AI Footprint: DO NOT use emojis. DO NOT use dashes or hyphens like "-", "—", "–". DO NOT use robotic words.
            3. Typo Rule: You MUST intentionally make exactly ONE minor, natural spelling mistake or typo in the tweet (e.g., "teh" instead of "the", "realy" instead of "really", "project" as "profect") so it looks like a busy human typed it fast.
            4. Tagging: You MUST tag the target user ${target} naturally within or at the end of the tweet.
            5. Anti-Repetition: Do not write anything similar to these past posts: [${historyText}]. Make this completely unique.
            6. Output ONLY the tweet text. No explanations, no quotes.`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${appData.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama3-8b-8192', // Free tier high speed model on Groq
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: `Context of the project (translate if in Bengali and write the tweet): ${context}` }
                        ],
                        temperature: 0.85 // High temperature for creative/varied outputs
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    let tweet = data.choices[0].message.content.trim();
                    // Strip any accidental wrapping quotes from AI response
                    tweet = tweet.replace(/^["']|["']$/g, '');
                    
                    outputElement.innerText = tweet;

                    // Add to history to avoid repetition next time
                    appData.folders[currentFolder].history.push(tweet);
                    saveToLocalStorage();
                    renderHistory();
                } else {
                    outputElement.innerText = 'Error: Check your API Key or connection limit.';
                }
            } catch (error) {
                console.error(error);
                outputElement.innerText = 'Failed to connect to the API. Make sure your Groq Key is valid.';
            }
        }

        function copyPost() {
            const text = document.getElementById('post-output').innerText;
            if(text && !text.startsWith('Your human-like') && !text.startsWith('Analyzing')) {
                navigator.clipboard.writeText(text);
                alert('Tweet copied to clipboard! 📋');
            } else {
                alert('Nothing to copy yet!');
            }
        }
    </script>
</body>
</html>
